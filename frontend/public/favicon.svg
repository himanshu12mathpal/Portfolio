  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <text x="32" y="46" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="40" fill="#00ff41" filter="url(#glow)">H</text>
</svg>